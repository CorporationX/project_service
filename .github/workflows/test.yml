name: Build and Test

on:
  pull_request:
    branches: murloc-master-stream9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Step 2 - Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Step 3 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Step 4 - Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Step 5 - Build with Gradle
        run: ./gradlew build

      - name: Step 6 - Test with Gradle
        run: ./gradlew test