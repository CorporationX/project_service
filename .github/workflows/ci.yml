name: CI on pull request and push to murloc-master-stream11
on:
  push:
    branches:
      - murloc-master-stream11
      - murloc11/BJS2-48041-ci-pipeline
  pull_request:
    branches:
      - '*'
    types: [ opened, reopened, synchronize, edited ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle test
        run: gradle test