name: CI on pull request and push to murloc-master-stream11
on:
  push:
    branches:
      - murloc-master-stream11
  pull_request:
    branches:
      - murloc-master-stream11
    types: [ opened, reopened, synchronize, edited ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloning repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gradle check
        run: ./gradlew check -x testClasses --no-daemon --continue