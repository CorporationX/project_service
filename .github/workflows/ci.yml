name: CI pipeline murloc11
on:
  push:
    branches:
      - murloc-master-stream11
  pull_request:
    branches:
      - murloc-master-stream11
    types: [ opened, reopened, synchronize, edited ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Step_1 - Cloning repository
        uses: actions/checkout@v4

      - name: Step_2 - Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Step_3 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Step_4 -Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Step_5 - generate Api
        run: ./gradlew openApiGenerate

      - name: Step_6 - Gradle check
        run: ./gradlew check -x testClasses --no-daemon --continue