name: Unit Tests on PR

on:
  pull_request:
    branches:
      - main
      - griffon-master-stream11
      - griffon/pipeline-bc11-BJS2-83672


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build testClasses -x test --no-daemon

      - name: Test with Gradle
        run: ./gradlew test -x testClasses --no-daemon --continue

      - name: Run tests with annotations
        run: |
          ./mvnw test --batch-mode
          # Если тесты упали, парсим ошибки
          if [ $? -ne 0 ]; then
            echo "::error::Unit tests failed! Check test report"
            # Дополнительно: парсинг JUnit отчета
            ./mvnw surefire-report:report-only
          fi