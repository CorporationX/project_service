name: CI pipeline manticore11
on:
  pull_request:
    branches:
      - manticore-master-stream11
    types: [ opened, reopened, synchronize, edited ]

permissions:
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: STEP_1 - check repository
        uses: actions/checkout@v4

      - name: STEP_2 - Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: STEP_3 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: STEP_4 - Cache Gradle
        uses: actions/cache@v4
        with:
          path:
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os}}-gradle-${{ hashFiles('**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: STEP_5 - Build and check
        run: ./gradlew build -x test --no-daemon

      - name: STEP_6 - Checkstyle verification
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon --continue

      - name: STEP_7 - Run tests
        run: ./gradlew test --no-daemon --continue

      - name: STEP_8 - Comment on failure
        if: failure()
        uses: actions/github-script@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Сборка упала**\nПроверь логи и исправь ошибки. После фикса статус обновится.'
            });