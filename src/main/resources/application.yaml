spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
        projects_view_channel:
          name: projects_view_channel

server:
  port: 8082
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info

calculations_messages_processing:
  enabled: true

google-service:
  application-name: corporation X cyclop
  credentialsFilePath: /credentials.json
  calendarId: primary
  redirectUrl: http://localhost:8082/api/v1/calendar/authorization
  accessType: offline
  scopes: https://www.googleapis.com/auth/calendar

services:
  s3:
    endpoint: http://127.0.0.1:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket
    isMocked: false


  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080