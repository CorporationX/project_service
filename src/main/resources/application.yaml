spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  config:
    import: 'optional:consul:'
  application:
    name: project-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: project-service-i1
      config:
        enabled: true
        watch:
          enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  google:
    api:
      application-name: "Project-service/1.0"
      calendar:
        credentials:
          path: classpath:google/calendar/credentials.json
        tokens:
          directory: tokens

server:
  port: 8082

logging:
  level:
    root: info
    org.zalando.logbook: TRACE

calculations_messages_processing:
  enabled: true

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  upload:
    vacancy-cover:
      maxFileSize: 5_242_880 # 5 MB
  payment-service:
    name: payment-service
  user-service:
    name: user-service

servlet:
  multipart:
    enabled: true
    max-file-size: 5MB
    max-request-size: 5MB
