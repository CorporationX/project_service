app:
  config:
    minio_bucket_name: "corpbucket"
    minio_login: "user"
    minio_password: "password"
    minio_endpoint: "http://localhost:9000"
    max_team_avatar_side_length: 512
    max_team_avatar_size_in_mb: 5
    max_project_storage_size: 2147483648

spring:
  mvc:
    servlet:
      path: /api/v1
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

jira:
  url: "https://faang-school.atlassian.net"
  user: secret_email
  token: secret_token

server:
  port: 8082


logging:
  level:
    root: info

calculations_messages_processing:
  enabled: true

google:
  calendar:
    settings:
      calendarId: fcc4660e6d7a24a8ef8ee0f841f3e0acf298d0b1e7c6b92a8bc0c5c3bc5f2a97@group.calendar.google.com
      zone: Europe/Moscow
    credentials:
      filePath: /google-credentials.json
      tokensPath: tokens

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  minio:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: project-files
    isMocked: false
    default-max-size: 2147483648 #2 GB
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080