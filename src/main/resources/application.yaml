spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
        team-channel: team-channel

  profiles:
    active: local

  retry:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB

retry:
  backoff:
    initial-interval: 1000
    multiplier: 3
    max-interval: 5000

clearing-configs-properties:
  poolSize: 1

jira-api-setting:
  jira-api-url: /rest/api/3
  max-results-returning: 500

file:
  cover-max-size: 5242880

server:
  port: 8082

logging:
  level:
    root: debug

calculations_messages_processing:
  enabled: true

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket
    isMocked: false
    region: us-east-1

  minio:
    endpoint: http://127.0.0.1:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket

  payment-service:
    host: http://localhost
    port: 9080

  user-service:
    host: http://localhost
    port: 8080

app:
  scheduler:
    jira-token-cleanup: "0 */10 * * * *"