spring:
  application:
    name: project-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: project-service
      environment: ${spring.profiles.active:default}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info
    io.minio: INFO
    faang.school.projectservice: INFO

calculations_messages_processing:
  enabled: true

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:user}
  secret-key: ${MINIO_SECRET_KEY:password}
  bucket-name: ${MINIO_BUCKET:projectbucket}
  region: ${MINIO_REGION:us-east-1}

# S3 Configuration (старая конфигурация, можно удалить если используете только minio)
services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080

# Jira Integration Configuration
jira:
  system:
    base-url: ${JIRA_BASE_URL}
    username: ${JIRA_USERNAME}
    api-token: ${JIRA_API_TOKEN}
  project-key: ${JIRA_PROJECT_KEY}
  issue-type: Task
  timeout-seconds: 30
  max-retries: 3
  
  # OAuth 2.0 Configuration
  oauth:
    enable: false
    client-id: ${JIRA_CLIENT_ID}
    client-secret: ${JIRA_CLIENT_SECRET}
    redirect-uri: ${JIRA_REDIRECT_URI}
    authorization-uri: https://auth.atlassian.com/authorize
    token-uri: https://auth.atlassian.com/oauth/token
    scope: read:jira-work write:jira-work offline_access
  
  # Cache Configuration
  cache:
    enabled: true                    # Включить/выключить кэш
    issue-ttl-minutes: 30            # TTL для Issues (30 минут)
    transitions-ttl-minutes: 15      # TTL для Transitions (15 минут)
    projects-ttl-hours: 24           # TTL для Projects (24 часа)
    users-ttl-hours: 24              # TTL для Users (24 часа)

# Jira Sync Configuration
jira.sync:
  enabled: true
  projects: PROJECT1,PROJECT2

# RabbitMQ Queue Names
rabbitmq:
  queue:
    jira:
      task:
        create: jira.task.create
        update: jira.task.update
        delete: jira.task.delete
        sync: jira.task.sync