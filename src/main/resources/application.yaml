spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: 8082

logging:
  level:
    root: info

calculations_messages_processing:
  enabled: true

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080

app:
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:user}
    secret-key: ${MINIO_SECRET_KEY:password}
    cover:
      bucket:
        cover-bucket
      max-image-dimension: 512
    presentations:
      endpoint: http://localhost:9000
      access-key: HZykibzYtPG1ABN2J073
      secret-key: qjGfUbiitoZyWPNYS24G4EQKDsxCba9rK28DoqEj
    bucket:
      name: "corpbucket"
  presentation:
    fileExtension: ".pdf"
    contentType: "application/pdf"
