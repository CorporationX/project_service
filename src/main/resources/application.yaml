spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: local

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

logging:
  level:
    root: info

calculations_messages_processing:
  enabled: true

minio:
  team-avatar:
    max-file-size: 5242880
    max-image-size: 512
    folder-name: team_avatar
  project-cover:
    max-size: 5242880
    max-vertical-resolution: 512
    max-horizontal-resolution: 1080
    compressed-output-quality: 0.5
    compressed-output-scale: 1
    folder-name: projects_covers

services:
  s3:
    endpoint: http://localhost:${MINIO_PORT:9000}
    accessKey: ${MINIO_ACCESS_KEY:user}
    secretKey: ${MINIO_SECRET_KEY:password}
    bucketName: projectbucket
    isMocked: false
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080