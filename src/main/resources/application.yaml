spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
      topics:
        profile_view: profile_view

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8082
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info

gallery:
  maxFiles: 50

calculations_messages_processing:
  enabled: true

aws:
  endpoint: http://localhost:9000
  accessKey: user
  secretKey: password
  bucketName: projectbucket
  isMocked: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

services:
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080
    version: /api/v1