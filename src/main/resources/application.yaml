spring:
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  servlet:
   multipart:
    max-file-size: 100MB
    max-request-size: 100MB

jira:
  url: https://testcorpx.atlassian.net/jira
  username: username
  api-token: token

server:
  port: 8082
  servlet:
    context-path: /projects/api

logging:
  level:
    root: info

calculations_messages_processing:
  enabled: true

cover:
  max-image-size: 5242880
  max-image-width: 1080
  max-image-height-horizontal: 566

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080

---

spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: debug

---

spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: info
