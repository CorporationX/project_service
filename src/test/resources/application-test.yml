spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: admin
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  sql:
    init:
      mode: never

logging:
  level:
    root: WARN

cover:
  max-size-bytes: 5242880
  max-width-horizontal: 1080
  max-height-horizontal: 566
  max-width-vertical: 566
  max-height-vertical: 1080
  max-square: 1080
  output-quality: 0.85