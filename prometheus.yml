# Prometheus Configuration
# Этот файл нужно разместить в директории с Prometheus

global:
  scrape_interval: 15s  # Интервал сбора метрик
  evaluation_interval: 15s  # Интервал оценки правил
  external_labels:
    cluster: 'project-service'
    environment: 'development'

# Конфигурация scrape для проекта
scrape_configs:
  # Метрики приложения Project Service
  - job_name: 'project-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8082']  # URL приложения
        labels:
          application: 'project-service'
          service: 'jira-integration'
    
  # Метрики Prometheus (самописные метрики)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

